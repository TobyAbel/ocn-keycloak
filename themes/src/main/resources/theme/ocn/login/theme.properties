# CivicOS / OCN login theme — extends keycloak.v2 (PatternFly 5) and layers brand
# on top. `styles` replaces the parent list, so we ship a copy of keycloak.v2's
# styles.css and load our brand overrides last. See resources/css/login.css.
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/login.css
